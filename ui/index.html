<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Gmail Draft Assistant</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    .thread { padding: 10px; border: 1px solid #ccc; margin-bottom: 8px; cursor: pointer; }
    .thread.selected { background: #eef; border-color: #339; }
    textarea { width: 100%; height: 80px; margin-top: 10px; }
    button { margin-top: 10px; padding: 8px 12px; }
  </style>
</head>
<body>

<h2>📧 Select Gmail Thread</h2>
<div id="threads"></div>

<h3>✍️ Instructions to AI</h3>
<textarea id="context" placeholder="Keep it short, friendly, ask for a call next week"></textarea>

<br />
<button onclick="createWorkflow()">Create Draft</button>

<div id="result"></div>

<script>
let selectedThreadId = null;
let workflowId = null;

async function loadThreads() {
  const res = await fetch("/gmail/threads?limit=10");
  const threads = await res.json();

  const container = document.getElementById("threads");
  container.innerHTML = "";

  threads.forEach(t => {
    const div = document.createElement("div");
    div.className = "thread";
    div.innerHTML = `<strong>${t.subject}</strong><br/>${t.from}`;
    div.onclick = () => {
      document.querySelectorAll(".thread").forEach(el => el.classList.remove("selected"));
      div.classList.add("selected");
      selectedThreadId = t.thread_id;
    };
    container.appendChild(div);
  });
}

async function createWorkflow() {
  if (!selectedThreadId) {
    alert("Select a thread first");
    return;
  }

  const context = document.getElementById("context").value;

  const res = await fetch("/workflows", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      type: "gmail",
      thread_id: selectedThreadId,
      user_context: context
    })
  });

  const data = await res.json();
  workflowId = data.workflow_id;

  document.getElementById("result").innerHTML = `
    <p>✅ Workflow created</p>
    <button onclick="approve()">Approve Draft</button>
  `;
}

async function approve() {
  await fetch(`/workflows/${workflowId}/approve`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      decision: "approved",
      reviewer: "founder"
    })
  });

  document.getElementById("result").innerHTML =
    "<p>🎉 Draft approved. Check Gmail → Drafts.</p>";
}

loadThreads();
</script>

</body>
</html>
